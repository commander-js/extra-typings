version: 2
updates:
  - package-ecosystem: "npm"
    target-branch: "develop"
    directory: "/"
    schedule:
      interval: "monthly"
    groups:
      # group simple version updates, leave major updates and security updates as single pull requests
      minor-and-patch:
        update-types:
          - "patch"
          - "minor"
        applies-to:
          - "version-updates"
  - package-ecosystem: "github-actions"
    target-branch: "develop"
    directory: "/"
    schedule:
      interval: "weekly"
